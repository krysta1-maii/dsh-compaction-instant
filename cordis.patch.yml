# dsh-compaction-instant bundle layer for DSH 0.1.2-rc.1.
#
# DSH 0.1.2 owns compaction backends on the per-agent preset plane. A
# host-level engine would receive every scoped agent event and race the engine
# selected by standard/ptc/cordis, so this bundle deliberately installs only
# the globally inherited recall companions. Activate the engine by aliasing the
# built-in package or by copying a preset and replacing its compaction row (see
# README). The Web bundle already disables its legacy host compaction row.
#
# The user's profile patch is applied after this bundle, so per-profile
# overrides of these companion rows still win.

- insert:
    - id: tool-recall
      name: dsh-compaction-instant/tool
    - id: command-recall
      name: dsh-compaction-instant/command
