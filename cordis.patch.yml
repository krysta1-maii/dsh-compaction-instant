# dsh-compaction-instant 0.4.1 bundle layer for DSH 0.2.x.
# Verified target for this release: 0.2.1-rc.5
# (b830ec950faba0a46dda564be3e2d854afed94f1). Earlier 0.3.0 targets were
# verified for that release only; this release re-verifies rc.5 alone, so do
# not read the peer range as a 0.4.1 compatibility claim.
#
# Companion rows only: loading this bundle does NOT activate the engine.
# Override the preset's isolated compaction group in the profile patch so its
# engine row names dsh-compaction-instant; the carrier row below is explicitly
# inert and must not be given engine configuration.
#
# The compaction-instant row is the settings bridge: its volatile Config
# schema makes DSH 0.2.0 serve the compaction-instant settings form, so the
# Plugins page can edit engine preferences live (persisted into the profile
# patch). Disable the row and every engine falls back to composition-only.
#
# The compaction-instant-preset-tools row owns the recall companions. It
# serves its own volatile "presets" list (namespace
# compaction-instant-preset-tools, default empty) and registers recall,
# search, and /recall in the scope of the live Agents whose composed preset is
# selected on the Plugins page. This bundle no longer installs the
# Host-global tool-recall or command-recall rows: after an upgrade the
# companions are off until a preset is enabled in the panel. Do not mix a
# static dsh-compaction-instant/tool or /command row into a preset that the
# panel also enables for the same Agent.
#
# The compaction-instant-client row carries the browser half: dsh-client-modules
# mounts a bundle's client module on the profile row whose specifier is exactly
# the package name, so this row names the bare package with carrier: true,
# which the root module dispatches to a no-op (no profile-level engine that
# could race the preset-owned backend). Disable the row and the Plugins page
# configuration section disappears; the engines keep working composition-only.
#
# Source edits do not update tarball deployments: repack and reinstall into
# the actual profile, then obtain user confirmation before host reload/restart.
# The user's later profile patch can override these rows.

- insert:
    - id: compaction-instant
      name: dsh-compaction-instant/settings
    - id: compaction-instant-preset-tools
      name: dsh-compaction-instant/preset-tools
    - id: compaction-instant-client
      name: dsh-compaction-instant
      config:
        carrier: true
